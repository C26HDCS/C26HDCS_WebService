spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql/application-schema.sql
        - classpath:sql/storage_delete_target.sql
        - classpath:sql/storage_retention_policy.sql
        - classpath:sql/storage_space_policy.sql
      data-locations: classpath:sql/application-data.sql

hdcs:
  background:
    enabled: false
  storage:
    cleanup:
      enabled: false
report:
  auto:
    enabled: false

logging:
  level:
    root: WARN
    kr.kwater.hdcs: DEBUG
