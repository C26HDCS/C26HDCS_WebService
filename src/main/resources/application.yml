server:
  port: 8080
  servlet:
    context-path: /hdcs
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: hdcs-web-service

  datasource:
    driver-class-name: org.postgresql.Driver
    # url: jdbc:h2:file:./localdb/hdcsdb;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    url: jdbc:postgresql://182.231.98.135:2345/c26hdcs
    username: c26hdcs
    password: C26hdcs@1234

  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL 초기화 (재시작 시 데이터 날아가는 것 방지)
  sql:
    init:
      # schema-locations: classpath:sql/schema.sql
      # data-locations: classpath:sql/data.sql
      mode: never
      encoding: UTF-8

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # MVC
  mvc:
    view:
      prefix: /templates/
      suffix: .html

# MyBatis
mybatis:
  mapper-locations: classpath:egovframework/mapper/**/*.xml
  type-aliases-package: kr.kwater.hdcs
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: true
    lazy-loading-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    kr.kwater.hdcs: DEBUG
    egovframework: DEBUG
    org.springframework: WARN
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/hdcs-external-web-service.log

# JWT 설정 
jwt:
  # 토큰 암호화 및 검증에 사용할 비밀키 (32바이트 이상의 임의의 긴 문자열)
  secret: c3ByaW5nLWJvb3Qtc2VjdXJpdHktand0LXNlY3JldC1rZXktZm9yLWt3YXRlci1kY2RzLWV4dGVybmFsLXNlcnZpY2U=

