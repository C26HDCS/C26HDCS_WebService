server:
  port: 8080
  servlet:
    context-path: /hdcs
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: hdcs-web-service

  datasource:
    driver-class-name: org.postgresql.Driver
    # url: jdbc:h2:file:./localdb/hdcsdb;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    url: jdbc:postgresql://182.231.98.135:2345/c26hdcs
    username: c26hdcs
    password: C26hdcs@1234

  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL 초기화 (재시작 시 데이터 날아가는 것 방지)
  sql:
    init:
      # schema-locations: classpath:sql/schema.sql
      # data-locations: classpath:sql/data.sql
      mode: never
      encoding: UTF-8

  # Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # MVC
  mvc:
    view:
      prefix: /templates/
      suffix: .html

# MyBatis
mybatis:
  mapper-locations: classpath:egovframework/mapper/**/*.xml
  type-aliases-package: kr.kwater.hdcs
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: true
    lazy-loading-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    kr.kwater.hdcs: INFO
    egovframework: INFO
    org.springframework: WARN
    org.mybatis: WARN
    org.apache.ibatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${HDCS_WEB_LOG_DIR:logs}/hdcs-web-service.log

hdcs:
  storage:
    cleanup:
      enabled: ${HDCS_STORAGE_CLEANUP_ENABLED:false}
      directory: ${HDCS_STORAGE_CLEANUP_DIR:}
      interval-ms: ${HDCS_STORAGE_CLEANUP_INTERVAL_MS:60000}
      initial-delay-ms: 60000
      max-files-per-run: 100
  logging:
    directory: ${HDCS_WEB_LOG_DIR:logs}
    python-log-directory: ${HDCS_PYTHON_LOG_DIR:../C26HDCS_Python/logs}
    # No automatic DB deletion unless explicitly enabled. Minimum retention is five calendar years.
    purge-expired-enabled: ${HDCS_LOG_PURGE_EXPIRED:false}

# JWT 설정
jwt:
  # 토큰 암호화 및 검증에 사용할 비밀키 (32바이트 이상의 임의의 긴 문자열)
  secret: c3ByaW5nLWJvb3Qtc2VjdXJpdHktand0LXNlY3JldC1rZXktZm9yLWt3YXRlci1kY2RzLWV4dGVybmFsLXNlcnZpY2U=

# 리포트 관리 설정
report:
  # 생성된 리포트 파일 저장 기준 디렉터리 (DB에는 이 경로 기준 상대경로만 저장)
  # 환경별로 REPORT_STORAGE_PATH 환경변수로 변경 가능
  storage-path: ${REPORT_STORAGE_PATH:./upload/reports}
  # 조회 가능한 최대 기간 (시작일~종료일 포함)
  max-period-days: 31
  # 데이터 유형별 상세 목록 최대 건수 (초과 시 최신순으로 잘라서 표시)
  max-detail-rows: 1000
  # PDF 다운로드용 변환 프로그램(LibreOffice) 실행 파일 경로 (서버에 맞게 LIBREOFFICE_PATH 환경변수로 변경 가능)
  soffice-path: ${LIBREOFFICE_PATH:C:/Program Files/LibreOffice/program/soffice.exe}
  # PDF 변환 제한 시간(초)
  pdf-timeout-seconds: 120
  # 리포트 자동 생성
  auto:
    # 자동 생성 사용 여부. 여러 PC가 같은 DB를 쓰는 개발 환경에서는 PC마다 리포트 파일이 따로 저장되므로
    # 켜기 전에 확인한다. (환경변수 REPORT_AUTO_ENABLED 로 덮어쓸 수 있다)
    enabled: ${REPORT_AUTO_ENABLED:true}
    # 서버 시작 때 지난주 리포트가 없으면 바로 만들지 여부
    catch-up-on-startup: false
    # 실행 시각: 초 분 시 일 월 요일 (매주 월요일 00:00)
    cron: "0 0 0 * * MON"
    # 실행 시각과 '지난주' 계산에 쓰는 시간대
    zone: Asia/Seoul
    # 자동 생성할 데이터 유형 (유형마다 리포트를 따로 만든다)
    data-types: [LOG, DATA]

---
# 운영 환경 프로파일
spring:
  config:
    activate:
      on-profile: prod

